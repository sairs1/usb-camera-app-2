<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10151d">
<title>Змейка НЯМ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#10151d;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center}.wrap{width:min(100%,520px);padding:14px 14px 24px;text-align:center}h1{font-size:28px;margin:3px 0 8px}.top{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:6px 5px 10px}canvas{display:block;width:100%;aspect-ratio:1;background:#18222d;border:3px solid #526272;border-radius:18px;touch-action:none;box-shadow:0 10px 35px #0006}.start{width:100%;height:58px;margin-top:12px;border:0;border-radius:17px;background:#9ee493;color:#102013;font-size:20px;font-weight:900}.controls{display:grid;grid-template-columns:repeat(3,76px);gap:8px;justify-content:center;margin-top:12px}.controls button{height:62px;border:0;border-radius:18px;background:#e9eef4;color:#151a20;font-size:28px;font-weight:900;touch-action:manipulation}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.hint{opacity:.72;font-size:13px;margin-top:9px;line-height:1.35}.msg{height:24px;margin-top:5px;font-weight:800}
</style>
</head>
<body><div class="wrap">
<h1>🐍 Змейка «НЯМ»</h1>
<div class="top"><span>Счёт: <b id="score">0</b></span><span>Рекорд: <b id="best">0</b></span></div>
<canvas id="game" width="400" height="400"></canvas>
<div class="msg" id="msg">Жми «Играть» 👇</div>
<button class="start" id="start">▶ Играть / заново</button>
<div class="controls">
<button class="up">↑</button><button class="left">←</button><button class="down">↓</button><button class="right">→</button>
</div>
<div class="hint">Можно свайпать прямо по полю. Звук включится после нажатия «Играть».</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),CELL=20,N=20;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');
let snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}],food={x:14,y:10},dx=1,dy=0,nx=1,ny=0,score=0,best=+localStorage.getItem('snakeBest')||0,timer=null,audio=null;
bestEl.textContent=best;
function beep(kind){
 try{
  if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
  audio.resume();
  const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
  o.connect(g);g.connect(audio.destination);
  if(kind==='eat'){o.type='square';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(760,t+.12);g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.start(t);o.stop(t+.18)}
  else{o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(45,t+.48);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.52);o.start(t);o.stop(t+.53)}
 }catch(e){}
}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function start(){
 clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dx=1;dy=0;nx=1;ny=0;score=0;scoreEl.textContent='0';msg.textContent='НЯМКАЙ! 🍎';placeFood();draw();if(!audio)try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){};if(audio)audio.resume();timer=setInterval(step,125)
}
function setDir(a,b){if(a!==-dx||b!==-dy){nx=a;ny=b}}
function step(){
 dx=nx;dy=ny;const h={x:snake[0].x+dx,y:snake[0].y+dy};
 if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){
  clearInterval(timer);timer=null;beep('dead');msg.textContent='БУМ 💀 ещё раз?';draw(true);return
 }
 snake.unshift(h);
 if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;beep('eat');if(score>best){best=score;localStorage.setItem('snakeBest',best);bestEl.textContent=best}placeFood()}else snake.pop();
 draw()
}
function draw(dead=false){
 ctx.fillStyle='#18222d';ctx.fillRect(0,0,400,400);
 ctx.strokeStyle='#1e2b38';ctx.lineWidth=1;for(let i=20;i<400;i+=20){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(400,i);ctx.stroke()}
 ctx.fillStyle='#ff5b5b';ctx.beginPath();ctx.arc(food.x*CELL+10,food.y*CELL+10,8,0,Math.PI*2);ctx.fill();
 snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#b8ff85':'#65d66e';ctx.fillRect(p.x*CELL+2,p.y*CELL+2,16,16)});
 if(dead){ctx.fillStyle='#0009';ctx.fillRect(0,0,400,400);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 36px system-ui';ctx.fillText('БУМ! 💀',200,190);ctx.font='20px system-ui';ctx.fillText('Жми «Играть / заново»',200,226)}
}
document.getElementById('start').addEventListener('click',start);
document.querySelector('.up').onclick=()=>setDir(0,-1);document.querySelector('.down').onclick=()=>setDir(0,1);document.querySelector('.left').onclick=()=>setDir(-1,0);document.querySelector('.right').onclick=()=>setDir(1,0);
let sx=0,sy=0;c.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});c.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});c.addEventListener('touchend',e=>{const t=e.changedTouches[0],ax=t.clientX-sx,ay=t.clientY-sy;if(Math.max(Math.abs(ax),Math.abs(ay))<18)return;if(Math.abs(ax)>Math.abs(ay))setDir(ax>0?1:-1,0);else setDir(0,ay>0?1:-1)},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowUp')setDir(0,-1);if(e.key==='ArrowDown')setDir(0,1);if(e.key==='ArrowLeft')setDir(-1,0);if(e.key==='ArrowRight')setDir(1,0)});
draw();
</script></body></html>
